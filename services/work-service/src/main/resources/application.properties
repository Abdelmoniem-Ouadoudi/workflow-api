spring.application.name=work-service

# 8080 is the default and is commonly taken by a local Apache or Tomcat install.
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/workflow
spring.datasource.username=workflow
spring.datasource.password=workflow

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# No app.cors.allowed-origins since M2. CORS moved to the gateway, which is the only address a
# browser calls. Setting it here as well sent Access-Control-Allow-Origin twice - once from the
# gateway, once forwarded from here - and a browser rejects the duplicate.

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Register by IP rather than by hostname: on Windows the machine name often does not resolve
# from another process, and the gateway would then hold an address it cannot dial.
eureka.instance.prefer-ip-address=true

# The same secret auth-service signs with. This service only ever verifies - it has no encoder
# and issues nothing. Production sets JWT_SECRET; the dev default keeps a fresh clone runnable.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-32+}
# Checked on every token. A valid signature from some other system that happens to share a
# secret is still not a token this service should accept.
app.jwt.issuer=auth-service

# The correlation id set by the gateway, on every log line of this service.
logging.pattern.level=%5p [${spring.application.name},%X{corrId:-no-corr-id}]

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=workflow
spring.rabbitmq.password=workflow

# THE setting that decides whether the dead-letter queue does anything at all. The default is
# true, which puts a failed message straight back on the queue and retries it forever at full
# speed - the queue never drains and the DLQ stays empty while everything is broken.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Retry is configured in ListenerRetryConfig, not here. These properties apply one policy to every
# exception, and the distinction that matters cannot be expressed: a database blip deserves three
# attempts with backoff, while a classification whose issue was deleted should be parked at once.
# Setting them here as well would give two places that decide, and these would win.

# Above this confidence the suggestion is written onto the issue with nobody watching. High on
# purpose: a wrong auto-apply means someone quietly works the wrong ticket, while not applying
# costs one click. A policy, so it lives in config and not in a constant.
app.classification.auto-apply-threshold=0.85
