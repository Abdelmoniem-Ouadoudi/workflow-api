spring.application.name=work-service

# 8080 is the default and is commonly taken by a local Apache or Tomcat install.
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/workflow
spring.datasource.username=workflow
spring.datasource.password=workflow

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Explicit origins per environment. "*" is not usable here: the spec forbids
# combining it with allowCredentials, which the browser then rejects.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
