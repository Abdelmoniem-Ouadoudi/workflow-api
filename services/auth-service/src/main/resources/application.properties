spring.application.name=auth-service
server.port=8082

# authdb, not workflow. A different database in the same Postgres process: work-service has no
# connection to it and therefore cannot join a credential to an issue. Sharing the process is a
# deployment cost in a demo, not a coupling - moving it out is a change to this one line.
spring.datasource.url=jdbc:postgresql://localhost:5433/authdb
spring.datasource.username=workflow
spring.datasource.password=workflow

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Register by IP rather than by hostname: on Windows the machine name often does not resolve
# from another process, and the gateway would then hold an address it cannot dial.
eureka.instance.prefer-ip-address=true

# The signing key. A dev default so the project runs straight after a clone; production sets
# JWT_SECRET and never touches this file. HS256 needs at least 32 characters - JwtConfig refuses
# to start on anything shorter rather than signing with a weak key.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-32+}
app.jwt.issuer=auth-service
# One hour. Long enough that nobody is logged out mid-task, short enough that a leaked token
# expires on its own. There is no refresh token yet - see docs/BACKLOG.md.
app.jwt.ttl=1h

# The correlation id set by the gateway, on every log line of this service.
logging.pattern.level=%5p [${spring.application.name},%X{corrId:-no-corr-id}]
