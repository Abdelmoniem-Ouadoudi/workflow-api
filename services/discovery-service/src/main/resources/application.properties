spring.application.name=discovery-service
# PORT is what Railway sets. 8761 when it is absent, which is every local run.
server.port=${PORT:8761}

# This instance is the registry. It does not register with itself or pull a copy of the
# registry down at startup - both are what a client service does, and this is not one.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
