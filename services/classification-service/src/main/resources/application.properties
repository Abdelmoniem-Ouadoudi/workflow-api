spring.application.name=classification-service
server.port=8083

# No datasource. This service consumes, calls a model, publishes and forgets. The AIClassification
# row belongs to work-service, next to the issue it describes - which is what leaves this service
# stateless, and therefore safe to run more than one of.

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=workflow
spring.rabbitmq.password=workflow

# THE setting that decides whether the dead-letter queue does anything. The default is true, which
# puts a failed message straight back on the queue and retries it forever at full speed: the queue
# never drains, the DLQ stays empty, and nothing anywhere says the system is stuck.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Retry is configured in ListenerRetryConfig, not here. These properties apply one policy to every
# exception, and the distinction that matters cannot be expressed: a rate limit deserves three
# attempts with backoff, while a message with no issue id or a rejected API key should be parked
# immediately instead of failing three times to prove it. Leaving them set as well would give two
# places that decide, and the properties would win.

# One ticket at a time per thread, two threads. Small on purpose: each message costs an API call
# to an external provider with a rate limit, so more concurrency would buy 429s rather than speed.
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.prefetch=1

# stub or groq.
#
# stub is the default so the project runs on a fresh clone with no API key. It is keyword rules,
# not intelligence, and it says so three ways: a warning on startup, modelVersion=stub-v1 on every
# row it produces, and that version printed on the suggestion chip in the UI. Demonstrating the
# stub while believing it is AI would be the worst thing to discover in front of a jury.
#
# For the real thing: set GROQ_API_KEY in the environment, then set this to groq.
app.classification.provider=${CLASSIFICATION_PROVIDER:stub}

# Groq speaks OpenAI's protocol, so the OpenAI client IS the Groq client - only the URL changes.
#
# The /v1 is required and was wrong at first. Spring AI 2.0 builds on the official openai-java SDK,
# which appends only /chat/completions to this value - unlike the older Spring AI, which added the
# /v1 itself. Without it Groq answers "Unknown request URL: POST /openai/chat/completions", and the
# mistake is invisible until a key is present to try it with.
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# From the environment, never from this file.
spring.ai.openai.api-key=${GROQ_API_KEY:not-set}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
# JSON_OBJECT, not JSON_SCHEMA: Groq supports the first everywhere and the second only on some
# models. Spring AI puts the schema into the prompt from the Suggestion record either way.
spring.ai.openai.chat.options.response-format.type=JSON_OBJECT
# 0.2, not the default 0.8. This is a classification: the same ticket should get the same answer
# twice, and creativity is the opposite of what is wanted.
spring.ai.openai.chat.options.temperature=0.2

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Register by IP rather than hostname: on Windows the machine name often does not resolve from
# another process, and a caller would hold an address it cannot dial.
eureka.instance.prefer-ip-address=true

# The same secret the other services verify with. This one only ever verifies.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-32+}
app.jwt.issuer=auth-service

# The correlation id, whether it arrived over HTTP or on a message header, on every log line.
logging.pattern.level=%5p [${spring.application.name},%X{corrId:-no-corr-id}]
